<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cronograma · Asistencia de dirección</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <link rel="stylesheet" href="../../panel/panel.css">
  <link rel="stylesheet" href="cronograma.css">
</head>
<body>
  <div class="app">
    <aside id="lateral" class="lateral"></aside>
    <main class="contenido">
      <header class="cabecera">
        <div>
          <h1>Cronograma</h1>
          <p>Fechas, duración, calendario y vencimientos</p>
        </div>
        <button class="btn primario" data-nueva>Nueva actividad</button>
      </header>
      <div id="aviso"></div>

      <div class="pestanas" role="tablist">
        <button role="tab" data-tab="panel" aria-selected="true">Panel del cronograma</button>
        <button role="tab" data-tab="calendario" aria-selected="false">Calendario</button>
        <button role="tab" data-tab="lista" aria-selected="false">Lista de actividades</button>
      </div>

      <div id="filtros" class="herramientas" hidden>
        <input id="q" type="search" placeholder="Buscar por código, nombre, lugar o persona" aria-label="Buscar actividades">
        <select id="f-mostrar" aria-label="Mostrar" hidden></select>
        <select id="f-etapa" aria-label="Etapa"></select>
        <select id="f-depto" aria-label="Departamento"></select>
        <select id="f-persona" aria-label="Participante"></select>
        <button class="btn" id="limpiar">Limpiar filtros</button>
      </div>

      <section id="tab-panel" role="tabpanel">
        <div id="resumen" class="resumen" aria-label="Resumen del cronograma"></div>
        <div class="rejilla" style="margin-top:28px">
          <div>
            <section class="seccion">
              <h2>Próximas actividades</h2>
              <ul id="proximas" class="filas"></ul>
            </section>
          </div>
          <div>
            <section class="seccion">
              <h2>Requieren atención</h2>
              <ul id="atencion" class="alertas"></ul>
            </section>
          </div>
        </div>
      </section>

      <section id="tab-calendario" role="tabpanel" hidden>
        <div class="cal-nav">
          <button class="btn" data-nav="-1" aria-label="Anterior">‹</button>
          <button class="btn" data-nav="0">Hoy</button>
          <button class="btn" data-nav="1" aria-label="Siguiente">›</button>
          <strong id="cal-titulo"></strong>
          <span class="espacio"></span>
          <div class="grupo-vista" role="group" aria-label="Vista">
            <button class="btn" data-vista="semana">Semana</button><button class="btn" data-vista="dia">Día</button>
          </div>
          <select id="cal-color" aria-label="Colorear por">
            <option value="depto">Color por departamento</option>
            <option value="etapa">Color por etapa</option>
          </select>
          <label class="check-venc"><input type="checkbox" id="ver-venc" checked> Vencimientos de tareas</label>
        </div>
        <div id="leyenda" class="leyenda"></div>
        <div id="cal" class="cal"></div>
        <p class="nota">Haz clic en un hueco del calendario para crear una actividad a esa hora. Las canceladas no se muestran aquí; búscalas en la lista.</p>
      </section>

      <section id="tab-lista" role="tabpanel" hidden>
        <div class="tabla-caja"><table>
          <thead><tr>
            <th><button class="orden" data-orden="codigo">Código</button></th>
            <th><button class="orden" data-orden="titulo">Actividad</button></th>
            <th><button class="orden" data-orden="inicio">Fecha y hora</button></th>
            <th><button class="orden" data-orden="duracion">Duración</button></th>
            <th>Lugar</th>
            <th>Participantes</th>
            <th><button class="orden" data-orden="estado">Estado</button></th>
            <th></th>
          </tr></thead>
          <tbody id="lista-filas"></tbody>
        </table></div>
        <p id="lista-total" class="nota"></p>
      </section>
    </main>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="../../data/semillas/semillas.js"></script>
  <script src="../../js/servicios/db.js"></script>
  <script src="../../js/servicios/equipo.service.js"></script>
  <script src="../../js/servicios/tareas.service.js"></script>
  <script src="../../js/servicios/cronograma.service.js"></script>
  <script src="../../js/componentes/formulario.js"></script>
  <script src="../../js/componentes/respaldo.js"></script>
  <script src="../../js/componentes/lateral.js"></script>
  <script>Lateral.render('cronograma', '../../');</script>
  <script src="cronograma.js"></script>
</body>
</html>
