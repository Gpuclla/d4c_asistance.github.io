<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipo y cargos · Asistencia de dirección</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <link rel="stylesheet" href="../../panel/panel.css">
  <link rel="stylesheet" href="equipo.css">
</head>
<body>
  <div class="app">
    <aside id="lateral" class="lateral"></aside>
    <main class="contenido">
      <header class="cabecera">
        <h1>Equipo y cargos</h1>
        <p>Personas, funciones y disponibilidad</p>
      </header>
      <div id="aviso"></div>
      <section id="indicadores" class="indicadores" aria-label="Resumen del equipo"></section>
      <div id="alerta-cargos"></div>

      <div class="pestanas" role="tablist">
        <button role="tab" data-tab="directorio" aria-selected="true">Directorio de personas</button>
        <button role="tab" data-tab="cargos" aria-selected="false">Cargos y departamentos</button>
        <button role="tab" data-tab="disponibilidad" aria-selected="false">Disponibilidad</button>
      </div>

      <section id="tab-directorio" role="tabpanel">
        <div class="herramientas">
          <input id="q" type="search" placeholder="Buscar por nombre, cargo o departamento" aria-label="Buscar personas">
          <select id="f-estado" aria-label="Estado de participación">
            <option value="">Todos los estados</option>
            <option value="confirmada">Confirmada</option>
            <option value="pendiente">Pendiente</option>
            <option value="baja">Ya no participa</option>
          </select>
          <span class="espacio"></span>
          <button class="btn primario" data-nueva-persona>Nueva persona</button>
        </div>
        <div class="tabla-caja"><table>
          <thead><tr><th>Persona</th><th>Cargos</th><th>Participación</th><th>Disponibilidad</th><th></th></tr></thead>
          <tbody id="dir-filas"></tbody>
        </table></div>
      </section>

      <section id="tab-cargos" role="tabpanel" hidden>
        <div class="herramientas">
          <select id="f-depto" aria-label="Departamento"></select>
          <label><input id="f-vac" type="checkbox"> Solo cargos vacantes</label>
          <span class="espacio"></span>
          <button class="btn primario" data-nuevo-cargo>Nuevo cargo</button>
        </div>
        <div id="cargos-lista"></div>
        <datalist id="lista-deptos"></datalist>
      </section>

      <section id="tab-disponibilidad" role="tabpanel" hidden>
        <div class="herramientas"><p class="tenue">Los cambios se guardan al salir de cada campo.</p></div>
        <div class="tabla-caja"><table>
          <thead><tr><th>Persona</th><th>Disponibilidad general</th><th>Restricciones</th><th>Observaciones</th></tr></thead>
          <tbody id="disp-filas"></tbody>
        </table></div>
        <p class="nota">La disponibilidad por fecha se conectará cuando construyamos el cronograma.</p>
      </section>
    </main>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="../../data/semillas/semillas.js"></script>
  <script src="../../js/servicios/db.js"></script>
  <script src="../../js/servicios/equipo.service.js"></script>
  <script src="../../js/componentes/formulario.js"></script>
  <script src="../../js/componentes/respaldo.js"></script>
  <script src="../../js/componentes/lateral.js"></script>
  <script>Lateral.render('equipo', '../../');</script>
  <script src="equipo.js"></script>
</body>
</html>
